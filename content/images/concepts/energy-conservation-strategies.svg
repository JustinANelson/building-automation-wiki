<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320">
  <rect x="8" y="8" width="664" height="304" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <rect x="8" y="8" width="664" height="32" rx="6" fill="#1e293b"/>
  <text x="24" y="29" font-family="sans-serif" font-weight="bold" font-size="13" fill="#ffffff">ASHRAE 90.1 / Guideline 36 Dual-Maximum VAV vs. Legacy Single-Minimum Reheat</text>

  <!-- Left: Legacy Single-Minimum VAV -->
  <rect x="24" y="54" width="308" height="156" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="38" y="74" font-family="sans-serif" font-weight="bold" font-size="11" fill="#991b1b">1. Legacy Single-Minimum VAV (High Energy Waste)</text>
  <line x1="60" y1="88" x2="60" y2="180" stroke="#334155" stroke-width="1.5"/>
  <line x1="60" y1="180" x2="310" y2="180" stroke="#334155" stroke-width="1.5"/>
  <text x="54" y="98" font-family="monospace" font-size="8.5" fill="#0f172a" text-anchor="end">100%</text>
  <text x="54" y="148" font-family="monospace" font-size="8.5" fill="#991b1b" text-anchor="end">30%</text>
  <polyline points="68,145 180,145 296,94" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <polyline points="68,100 140,180 296,180" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="180" y="196" font-family="sans-serif" font-size="9" fill="#334155" text-anchor="middle">Heating &#8592; Deadband &#8594; Cooling</text>
  <text x="186" y="136" font-family="sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">High 30-50% Min Flow Reheated</text>

  <!-- Right: Dual-Maximum VAV -->
  <rect x="348" y="54" width="308" height="156" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="362" y="74" font-family="sans-serif" font-weight="bold" font-size="11" fill="#15803d">2. Dual-Maximum VAV Sequence (Guideline 36)</text>
  <line x1="384" y1="88" x2="384" y2="180" stroke="#334155" stroke-width="1.5"/>
  <line x1="384" y1="180" x2="636" y2="180" stroke="#334155" stroke-width="1.5"/>
  <text x="378" y="98" font-family="monospace" font-size="8.5" fill="#0f172a" text-anchor="end">100%</text>
  <text x="378" y="128" font-family="monospace" font-size="8.5" fill="#b91c1c" text-anchor="end">50%</text>
  <text x="378" y="166" font-family="monospace" font-size="8.5" fill="#15803d" text-anchor="end">15%</text>
  <polyline points="392,125 446,164 516,164 624,94" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <polyline points="392,102 446,102 480,180 624,180" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="510" y="196" font-family="sans-serif" font-size="9" fill="#334155" text-anchor="middle">Stg2 Flow &#8592; Stg1 DAT &#8592; Low Min &#8594; Cooling</text>
  <text x="506" y="156" font-family="sans-serif" font-weight="bold" font-size="9" fill="#15803d" text-anchor="middle">Low 10-15% Deadband CFM</text>

  <!-- Bottom 4-pillar summary -->
  <rect x="24" y="222" width="150" height="76" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="99" y="240" font-family="sans-serif" font-weight="bold" font-size="10" fill="#1e40af" text-anchor="middle">Optimal Start / Stop</text>
  <text x="99" y="256" font-family="monospace" font-size="8.5" fill="#0f172a" text-anchor="middle">Adaptive deg/hr ramp</text>
  <text x="99" y="270" font-family="sans-serif" font-size="8.5" fill="#334155" text-anchor="middle">OA Damper Closed in</text>
  <text x="99" y="283" font-family="sans-serif" font-size="8.5" fill="#334155" text-anchor="middle">Morning Warm-Up</text>

  <rect x="184" y="222" width="150" height="76" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="259" y="240" font-family="sans-serif" font-weight="bold" font-size="10" fill="#15803d" text-anchor="middle">CO2 Demand Vent (DCV)</text>
  <text x="259" y="256" font-family="monospace" font-size="8.5" fill="#0f172a" text-anchor="middle">400-1000 ppm NDIR</text>
  <text x="259" y="270" font-family="sans-serif" font-size="8.5" fill="#334155" text-anchor="middle">Resets OA from Ra*Az</text>
  <text x="259" y="283" font-family="sans-serif" font-size="8.5" fill="#334155" text-anchor="middle">to Full ASHRAE 62.1</text>

  <rect x="344" y="222" width="150" height="76" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="419" y="240" font-family="sans-serif" font-weight="bold" font-size="10" fill="#92400e" text-anchor="middle">Air &amp; Water Resets</text>
  <text x="419" y="256" font-family="monospace" font-size="8.5" fill="#0f172a" text-anchor="middle">Duct SP + DAT + Hydronic</text>
  <text x="419" y="270" font-family="sans-serif" font-size="8.5" fill="#334155" text-anchor="middle">Condensing HHW &lt;130&#176;F</text>
  <text x="419" y="283" font-family="sans-serif" font-size="8.5" fill="#334155" text-anchor="middle">CHW Lift Optimization</text>

  <rect x="504" y="222" width="152" height="76" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="580" y="240" font-family="sans-serif" font-weight="bold" font-size="10" fill="#991b1b" text-anchor="middle">Automated FDD</text>
  <text x="580" y="256" font-family="monospace" font-size="8.5" fill="#0f172a" text-anchor="middle">ASHRAE 90.1 / G36 Rules</text>
  <text x="580" y="270" font-family="sans-serif" font-size="8.5" fill="#334155" text-anchor="middle">Flags Leaking Coils &amp;</text>
  <text x="580" y="283" font-family="sans-serif" font-size="8.5" fill="#334155" text-anchor="middle">Stuck Economizer Dampers</text>
</svg>
