  </g>

  <!-- Bourdon Tube Hydronic Gage -->
  <g transform="translate(235, 56)">
    <rect x="0" y="0" width="170" height="196" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <circle cx="85" cy="70" r="48" fill="#f1f5f9" stroke="#1e293b" stroke-width="2.5"/>
