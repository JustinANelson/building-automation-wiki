<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280">
  <rect x="8" y="8" width="624" height="264" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <rect x="8" y="8" width="624" height="32" rx="6" fill="#1e293b"/>
  <text x="24" y="29" font-family="sans-serif" font-weight="bold" font-size="13" fill="#ffffff">Mechanical Gages &amp; Local Instrumentation in HVAC Systems</text>

  <!-- Magnehelic Diff Pressure Gage -->
  <g transform="translate(36, 56)">
    <rect x="0" y="0" width="170" height="196" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <circle cx="85" cy="78" r="54" fill="#f1f5f9" stroke="#1e293b" stroke-width="2.5"/>
    <path d="M 45 95 A 45 45 0 0 1 125 95" fill="none" stroke="#334155" stroke-width="1.5"/>
    <line x1="85" y1="88" x2="108" y2="54" stroke="#dc2626" stroke-width="2"/>
