<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310">
  <rect x="8" y="8" width="664" height="294" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <rect x="8" y="8" width="664" height="32" rx="6" fill="#1e293b"/>
  <text x="24" y="29" font-family="sans-serif" font-weight="bold" font-size="13" fill="#ffffff">VAV Discharge Air Temperature (DAT) Reset &amp; Dehumidification Clamp</text>

  <!-- Left: OAT Reset Schedule Graph -->
  <rect x="24" y="54" width="310" height="162" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="38" y="74" font-family="sans-serif" font-weight="bold" font-size="11" fill="#0f172a">1. Outdoor Air Reset Schedule + Cooling T&amp;R</text>

  <!-- Axes -->
  <line x1="68" y1="90" x2="68" y2="184" stroke="#334155" stroke-width="1.5"/>
  <line x1="68" y1="184" x2="312" y2="184" stroke="#334155" stroke-width="1.5"/>

  <!-- Y Axis Labels -->
  <text x="62" y="102" font-family="monospace" font-size="9" fill="#15803d" text-anchor="end">65 &#176;F</text>
  <text x="62" y="136" font-family="monospace" font-size="9" fill="#0f172a" text-anchor="end">60 &#176;F</text>
  <text x="62" y="170" font-family="monospace" font-size="9" fill="#1e40af" text-anchor="end">55 &#176;F</text>

  <!-- X Axis Labels -->
  <text x="110" y="198" font-family="monospace" font-size="9" fill="#0f172a" text-anchor="middle">50 &#176;F OAT</text>
  <text x="246" y="198" font-family="monospace" font-size="9" fill="#0f172a" text-anchor="middle">70 &#176;F OAT</text>

  <!-- Reset Slope Line (Upper Limit) -->
  <polyline points="74,98 110,98 246,166 304,166" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <!-- Dehumidification / Peak Load Clamp -->
  <line x1="74" y1="166" x2="304" y2="166" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="186" y="116" font-family="sans-serif" font-weight="bold" font-size="9.5" fill="#15803d">Max DAT Limit (Mild Weather)</text>
  <text x="186" y="158" font-family="sans-serif" font-size="9" fill="#1e40af">55 &#176;F Latent Dehum / High Load</text>

  <!-- Right: Energy Tradeoff & Multi-Zone Requests -->
  <rect x="348" y="54" width="308" height="162" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="362" y="74" font-family="sans-serif" font-weight="bold" font-size="11" fill="#0f172a">2. Part-Load Energy Tradeoff in VAV Systems</text>

  <rect x="362" y="86" width="280" height="54" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="372" y="103" font-family="sans-serif" font-weight="bold" font-size="10" fill="#15803d">Warmer DAT (60-65 &#176;F in Mild/Cold Weather)</text>
  <text x="372" y="118" font-family="sans-serif" font-size="9.5" fill="#0f172a">&#8226; Slashes simultaneous VAV reheat (Q = 1.08*CFM*dT)</text>
  <text x="372" y="132" font-family="sans-serif" font-size="9.5" fill="#0f172a">&#8226; Extends 100% airside economizer free-cooling hours</text>

  <rect x="362" y="148" width="280" height="54" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="372" y="165" font-family="sans-serif" font-weight="bold" font-size="10" fill="#1e40af">Colder DAT (53-55 &#176;F in Peak/Humid Weather)</text>
  <text x="372" y="180" font-family="sans-serif" font-size="9.5" fill="#0f172a">&#8226; Sub-dewpoint condensation removes latent humidity</text>
  <text x="372" y="194" font-family="sans-serif" font-size="9.5" fill="#0f172a">&#8226; Reduces design supply fan CFM &amp; cubic fan power</text>

  <!-- Bottom: SZVAV & Dual-Max Reheat Integration -->
  <rect x="24" y="228" width="632" height="60" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="38" y="247" font-family="sans-serif" font-weight="bold" font-size="10.5" fill="#92400e">3. Integration with Dual-Maximum VAV Reheat &amp; Packaged Rooftop SZVAV</text>
  <text x="38" y="264" font-family="sans-serif" font-size="9.5" fill="#0f172a">&#8226; <tspan font-weight="bold">VAV Reheat Discharge Cap:</tspan> Limit terminal reheat leaving air to &lt;= Room Temp + 15 &#176;F (ASHRAE 55) to prevent stratification.</text>
  <text x="38" y="279" font-family="sans-serif" font-size="9.5" fill="#0f172a">&#8226; <tspan font-weight="bold">Packaged SZVAV (York SSE / Trane Symbio):</tspan> Modulates compressor capacity for DAT while varying ECM/VFD fan speed for zone load.</text>
</svg>
