<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310">
  <rect x="8" y="8" width="664" height="294" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <rect x="8" y="8" width="664" height="32" rx="6" fill="#1e293b"/>
  <text x="24" y="29" font-family="sans-serif" font-weight="bold" font-size="13" fill="#ffffff">Hydronic Plant Topologies, Variable-Primary Flow &amp; Supply Temperature Resets</text>

  <!-- Left: Variable Primary Flow Chilled Water Plant -->
  <rect x="24" y="54" width="320" height="156" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="38" y="74" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1e40af">1. Variable-Primary Flow (VPF) Chiller Plant</text>

  <rect x="38" y="86" width="136" height="62" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="106" y="103" font-family="sans-serif" font-weight="bold" font-size="9.5" fill="#1e40af" text-anchor="middle">Chillers 1..N + Iso Valves</text>
  <text x="106" y="118" font-family="monospace" font-size="8.5" fill="#0f172a" text-anchor="middle">York YK OptiView / Trane</text>
  <text x="106" y="133" font-family="monospace" font-size="8.5" fill="#334155" text-anchor="middle">CHWST: 42 &#176;F &#8594; 50 &#176;F Reset</text>

  <rect x="190" y="86" width="140" height="62" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="260" y="103" font-family="sans-serif" font-weight="bold" font-size="9.5" fill="#15803d" text-anchor="middle">VFD Primary Pumps</text>
  <text x="260" y="118" font-family="monospace" font-size="8.5" fill="#0f172a" text-anchor="middle">Lead/Lag + dP Reset</text>
  <text x="260" y="133" font-family="monospace" font-size="8.5" fill="#334155" text-anchor="middle">Belimo 22PDP-18 @ 2/3 Loop</text>

  <rect x="38" y="156" width="292" height="42" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
  <text x="184" y="173" font-family="sans-serif" font-weight="bold" font-size="9.5" fill="#0f172a" text-anchor="middle">Evaporator Minimum Flow Bypass Valve + Flowmeter</text>
  <text x="184" y="188" font-family="monospace" font-size="8.5" fill="#b91c1c" text-anchor="middle">Modulates Open Only When Loop GPM &lt; Chiller Min_GPM</text>

  <!-- Right: Condensing Hot Water Boiler Reset -->
  <rect x="356" y="54" width="300" height="156" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="370" y="74" font-family="sans-serif" font-weight="bold" font-size="11" fill="#991b1b">2. Condensing Boiler HHW Outdoor Reset</text>

  <rect x="370" y="86" width="272" height="58" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="506" y="103" font-family="sans-serif" font-weight="bold" font-size="9.5" fill="#991b1b" text-anchor="middle">HHW Supply Temperature Reset Schedule</text>
  <text x="506" y="118" font-family="monospace" font-size="9" fill="#0f172a" text-anchor="middle">OAT 0 &#176;F &#8594; 180 &#176;F HHW  |  OAT 60 &#176;F &#8594; 110 &#176;F HHW</text>
  <text x="506" y="133" font-family="sans-serif" font-size="8.5" fill="#334155" text-anchor="middle">+ Valve Position Trim-and-Respond Override</text>

  <rect x="370" y="152" width="272" height="46" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="506" y="169" font-family="sans-serif" font-weight="bold" font-size="9.5" fill="#92400e" text-anchor="middle">Flue-Gas Dewpoint Threshold (&lt; 130 &#176;F HWR)</text>
  <text x="506" y="185" font-family="sans-serif" font-size="8.5" fill="#0f172a" text-anchor="middle">2-Way PICV / EQL Coils Maximize Delta-T (88% &#8594; 96% Eff)</text>

  <!-- Bottom: Energy & Staging Equations -->
  <rect x="24" y="222" width="632" height="66" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="38" y="241" font-family="sans-serif" font-weight="bold" font-size="10.5" fill="#0f172a">3. Hydronic Heat Transfer, Chiller Staging &amp; Condenser Water Lift Optimization</text>
  <text x="38" y="259" font-family="monospace" font-size="9.5" fill="#1e40af">Q (Btu/hr) = 500 * GPM * (T_return - T_supply)   |   Cooling Tons = GPM * dT / 24</text>
  <text x="38" y="276" font-family="sans-serif" font-size="9" fill="#334155">&#8226; <tspan font-weight="bold">Condenser Water Reset:</tspan> Tracks Outdoor Wet-Bulb + Approach (e.g., WB + 5 &#176;F, clamped &gt;= 60-65 &#176;F) to reduce compressor lift.</text>
</svg>
