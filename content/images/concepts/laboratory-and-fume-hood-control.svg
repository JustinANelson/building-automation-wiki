<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290">
  <rect x="8" y="8" width="624" height="274" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <rect x="8" y="8" width="624" height="32" rx="6" fill="#1e293b"/>
  <text x="24" y="29" font-family="sans-serif" font-weight="bold" font-size="13" fill="#ffffff">Laboratory Volumetric Airflow Tracking &amp; Fume Hood Face Velocity Control</text>

  <!-- Supply Valve -->
  <rect x="28" y="56" width="170" height="84" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="113" y="76" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1e40af" text-anchor="middle">Supply Venturi Valve</text>
  <text x="113" y="94" font-family="monospace" font-size="10" fill="#0f172a" text-anchor="middle">PVSA / TSVA / 570-804</text>
  <text x="113" y="110" font-family="monospace" font-size="10" fill="#0f172a" text-anchor="middle">Flow: Q_sup = 800 CFM</text>
  <text x="113" y="126" font-family="sans-serif" font-size="9.5" fill="#334155" text-anchor="middle">+ Reheat Coil Modulating</text>

  <!-- Fume Hood Exhaust -->
  <rect x="442" y="56" width="170" height="84" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="527" y="76" font-family="sans-serif" font-weight="bold" font-size="11" fill="#991b1b" text-anchor="middle">Fume Hood Exhaust</text>
  <text x="527" y="94" font-family="monospace" font-size="10" fill="#0f172a" text-anchor="middle">PVEB / FHD500 / 570-007</text>
  <text x="527" y="110" font-family="monospace" font-size="10" fill="#0f172a" text-anchor="middle">Q_hood = 550 CFM</text>
  <text x="527" y="126" font-family="sans-serif" font-size="9.5" fill="#334155" text-anchor="middle">100 FPM @ Sash Height</text>

  <!-- General Exhaust -->
  <rect x="442" y="164" width="170" height="84" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="527" y="184" font-family="sans-serif" font-weight="bold" font-size="11" fill="#c2410c" text-anchor="middle">General Room Exhaust</text>
  <text x="527" y="202" font-family="monospace" font-size="10" fill="#0f172a" text-anchor="middle">PVEA / TEVA Venturi</text>
  <text x="527" y="218" font-family="monospace" font-size="10" fill="#0f172a" text-anchor="middle">Q_gen = 450 CFM</text>
  <text x="527" y="234" font-family="sans-serif" font-size="9.5" fill="#334155" text-anchor="middle">Tracks Hood + Temp Loop</text>

  <!-- Room Balance Controller -->
  <rect x="224" y="96" width="192" height="128" rx="6" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>
  <text x="320" y="120" font-family="sans-serif" font-weight="bold" font-size="11.5" fill="#0f172a" text-anchor="middle">Zone Balance Controller</text>
  <text x="320" y="136" font-family="monospace" font-size="10" fill="#334155" text-anchor="middle">Phoenix PBC500/504 or</text>
  <text x="320" y="150" font-family="monospace" font-size="10" fill="#334155" text-anchor="middle">Siemens LCM-OAVS (570)</text>
  <rect x="238" y="162" width="164" height="48" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="320" y="180" font-family="monospace" font-weight="bold" font-size="10" fill="#15803d" text-anchor="middle">Negative Offset = -200 CFM</text>
  <text x="320" y="198" font-family="monospace" font-size="9.5" fill="#0f172a" text-anchor="middle">Q_sup (800) - Q_exh (1000)</text>

  <line x1="198" y1="98" x2="224" y2="140" stroke="#2563eb" stroke-width="2"/>
  <line x1="416" y1="140" x2="442" y2="98" stroke="#dc2626" stroke-width="2"/>
  <line x1="416" y1="180" x2="442" y2="206" stroke="#ea580c" stroke-width="2"/>
</svg>
