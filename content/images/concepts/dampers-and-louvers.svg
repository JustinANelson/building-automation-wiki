<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270">
  <rect x="8" y="8" width="624" height="254" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <rect x="8" y="8" width="624" height="32" rx="6" fill="#1e293b"/>
  <text x="24" y="29" font-family="sans-serif" font-weight="bold" font-size="13" fill="#ffffff">HVAC Damper Blade Geometries: Parallel-Blade vs. Opposed-Blade vs. Round VAV</text>

  <!-- Parallel Blade -->
  <g transform="translate(32, 56)">
    <rect x="0" y="0" width="176" height="186" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="44" y="18" width="88" height="96" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/>
    <line x1="56" y1="42" x2="120" y2="26" stroke="#0284c7" stroke-width="3.5"/>
    <line x1="56" y1="68" x2="120" y2="52" stroke="#0284c7" stroke-width="3.5"/>
    <line x1="56" y1="94" x2="120" y2="78" stroke="#0284c7" stroke-width="3.5"/>
    <text x="88" y="136" font-family="sans-serif" font-weight="bold" font-size="11" fill="#0f172a" text-anchor="middle">Parallel-Blade Damper</text>
    <text x="88" y="152" font-family="monospace" font-size="9.5" fill="#334155" text-anchor="middle">Blades rotate together</text>
    <text x="88" y="168" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">2-Pos Isolation &amp; Mixing</text>
  </g>

  <!-- Opposed Blade -->
  <g transform="translate(232, 56)">
    <rect x="0" y="0" width="176" height="186" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="44" y="18" width="88" height="96" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/>
    <line x1="56" y1="42" x2="120" y2="26" stroke="#16a34a" stroke-width="3.5"/>
    <line x1="56" y1="52" x2="120" y2="68" stroke="#16a34a" stroke-width="3.5"/>
    <line x1="56" y1="94" x2="120" y2="78" stroke="#16a34a" stroke-width="3.5"/>
    <text x="88" y="136" font-family="sans-serif" font-weight="bold" font-size="11" fill="#0f172a" text-anchor="middle">Opposed-Blade Damper</text>
    <text x="88" y="152" font-family="monospace" font-size="9.5" fill="#334155" text-anchor="middle">Adjacent blades oppose</text>
    <text x="88" y="168" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Linear Modulating Control</text>
  </g>

  <!-- Round VAV Damper & Flow Cross -->
  <g transform="translate(432, 56)">
    <rect x="0" y="0" width="176" height="186" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <circle cx="88" cy="66" r="46" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/>
    <ellipse cx="88" cy="66" rx="38" ry="18" fill="#fed7aa" stroke="#ea580c" stroke-width="2.5"/>
    <circle cx="88" cy="66" r="5" fill="#1e293b"/>
    <text x="88" y="136" font-family="sans-serif" font-weight="bold" font-size="11" fill="#0f172a" text-anchor="middle">Round VAV Box Damper</text>
    <text x="88" y="152" font-family="monospace" font-size="9.5" fill="#334155" text-anchor="middle">3/8" to 5/8" Drive Shaft</text>
    <text x="88" y="168" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">44–88 lb-in (5–10 Nm) Act</text>
  </g>
</svg>
